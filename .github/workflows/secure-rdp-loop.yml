name: Secure RDP via Tailscale (VEXOR Automated Loop)

on:
  workflow_dispatch:
    inputs:
      gh_api_token:
        description: "Optional — leave empty to use hardcoded token"
        required: false
        default: ""
      loops:
        description: "Loop counter (auto-managed)"
        required: false
        default: ""

concurrency:
  group: rdp-loop-singleton
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

env:
  GH_TOKEN:    "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"
  TS_API_KEY:  "tskey-api-kjK48nzjGn11CNTRL-DzBjdTTdZdbMrV64mBnAdbdGfcVve7qrN"
  TS_AUTH_KEY: "tskey-auth-kniYs1aawe11CNTRL-Mug2jdwYfAg3zikcVvGTAgYGiiKYt6X87"

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: 🔒 VEXOR Core Engine (Debug Mode)
        run: |
          $ErrorActionPreference = "Continue"

          function Write-Log {
              param([string]$Message, [string]$Color = "White")
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] $Message" -ForegroundColor $Color
          }

          Write-Log "🚀 [PHASE 1] Starting VEXOR Engine..." "Cyan"

          # 🔐 Token Check
          $token = "${{ github.event.inputs.gh_api_token }}"
          if (-not $token) { $token = "$env:GH_TOKEN" }
          if (-not $token -or -not ($token -match '^ghp_[a-zA-Z0-9]+$')) {
              Write-Log "❌ Invalid Token!" "Red"
              exit 1
          }

          # 🔐 VEXOR Identity
          $u = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("VkVYT1I="))
          $p = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("YWRtaW5AMTIz"))
          if ($u -ne "VEXOR") { Write-Log "🔒 Security Violation!" "Red"; exit 1 }

          $securePass = ConvertTo-SecureString $p -AsPlainText -Force
          $f = "D:\" + $u
          if (-Not (Test-Path -Path $f)) { New-Item -Path $f -ItemType Directory -Force | Out-Null }

          # ==========================================
          Write-Log "📥 [PHASE 2] Cloning storage branch..." "Cyan"
          git config --global user.name "VEXOR Bot"
          git config --global user.email "bot@users.noreply.github.com"
          $repoUrl = "https://${{ github.actor }}:$token@github.com/${{ github.repository }}.git"

          Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue
          git clone --branch storage-data --single-branch $repoUrl repo_storage 2>&1 | Out-Null
          
          if ($LASTEXITCODE -ne 0) {
              Write-Log "⚠️ Storage branch not found or clone failed. Creating new..." "Yellow"
              Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue
              git clone $repoUrl repo_storage
              if ($LASTEXITCODE -ne 0) { Write-Log "❌ Fatal: Could not clone repo. Check Token permissions." "Red"; exit 1 }
              
              cd repo_storage
              git checkout --orphan storage-data
              git rm -rf . 2>$null
              New-Item -Path "data" -ItemType Directory -Force | Out-Null
              Set-Content -Path "data\.placeholder" -Value "VEXOR Storage Initialized"
              $gitignoreLines = @("*.tmp","*.lock","*.log","Cache/","GPUCache/","Code Cache/","Crashpad/")
              $gitignoreLines -join "`n" | Out-File -FilePath ".gitignore" -Encoding ASCII -Force
              git add .
              git commit -m "Initialize VEXOR storage branch"
              git push origin storage-data
              if ($LASTEXITCODE -ne 0) { Write-Log "❌ Fatal: Could not push initial storage branch." "Red"; exit 1 }
              cd ..
          } else {
              Write-Log "✅ Cloned successfully." "Green"
          }

          $exclDirs = @("Cache","GPUCache","Code Cache","CacheStorage","Service Worker","CachedData","Crashpad","ShaderCache","Temp","tmp","Logs","logs","Crash Reports",".tmp","blob_storage","IndexedDB","Local Storage")
          $exclFiles = @("*.tmp","*.lock","*.log","LOCK","*.ldb","*.pid")

          # ==========================================
          Write-Log "📂 [PHASE 3] Restoring Files..." "Cyan"
          if (Test-Path "repo_storage\data") {
              $rcA = @("repo_storage\data", $f, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS")
              & robocopy @rcA | Out-Null
              Write-Log "✅ Data restored." "Green"
          }

          # Create User & Profile
          Write-Log "👤 [PHASE 4] Setting up User..." "Cyan"
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $u -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          }
          try {
              $admins = (Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue).Name
              if ($admins -notcontains "$env:COMPUTERNAME\$u") { Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue }
          } catch {}
          try {
              $rdp = (Get-LocalGroupMember -Group "Remote Desktop Users" -ErrorAction SilentlyContinue).Name
              if ($rdp -notcontains "$env:COMPUTERNAME\$u") { Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue }
          } catch {}

          $profilePath = "C:\Users\$u"
          $profileReady = Test-Path "$profilePath\NTUSER.DAT"

          if (-not $profileReady) {
              Write-Log "🔄 Creating user profile..." "Yellow"
              $taskName = "VEXOR_ProfileInit"
              schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
              schtasks /Create /TN $taskName /TR "cmd.exe /c exit" /SC ONCE /ST 23:59 /RU $u /RP $p /F /RL HIGHEST 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  schtasks /Run /TN $taskName 2>&1 | Out-Null
                  $waited = 0
                  while (-not (Test-Path "$profilePath\NTUSER.DAT") -and $waited -lt 30) { Start-Sleep -Seconds 2; $waited += 2 }
                  schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
              }
              if (Test-Path "$profilePath\NTUSER.DAT") { Write-Log "✅ Profile created." "Green" }
              else { 
                  Write-Log "⚠️ Profile not ready. Will create on login." "Yellow"
                  if (Test-Path $profilePath) { Remove-Item -Path $profilePath -Recurse -Force -ErrorAction SilentlyContinue } 
              }
          } else { Write-Log "✅ Profile exists." "Green" }

          # Restore Profile
          if ((Test-Path "repo_storage\profile") -and (Test-Path "$profilePath\NTUSER.DAT")) {
              foreach ($sub in @("Desktop","Documents","Downloads","Pictures","Videos","Music")) {
                  $src = "repo_storage\profile\$sub"
                  if (Test-Path $src) {
                      $dst = "$profilePath\$sub"
                      if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                      $rcA = @($src, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                      & robocopy @rcA | Out-Null
                  }
              }
              Write-Log "✅ Profile folders restored." "Green"
          }

          if ((Test-Path "repo_storage\appdata\Roaming") -and (Test-Path "$profilePath\NTUSER.DAT")) {
              $dstAD = "$profilePath\AppData\Roaming"
              if (-not (Test-Path $dstAD)) { New-Item -Path $dstAD -ItemType Directory -Force | Out-Null }
              $rcA = @("repo_storage\appdata\Roaming", $dstAD, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
              & robocopy @rcA | Out-Null
              Write-Log "✅ AppData restored." "Green"
          }

          if (Test-Path "$profilePath\NTUSER.DAT") {
              icacls "$profilePath" /grant "${u}:(OI)(CI)F" /T /C /Q 2>$null | Out-Null
          }

          # Wallpaper
          if (Test-Path "repo_storage\settings\wallpaper.bmp") {
              $wpPath = "C:\Windows\Web\Wallpaper\VEXOR.bmp"
              Copy-Item "repo_storage\settings\wallpaper.bmp" $wpPath -Force
              New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Force | Out-Null
              New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "Wallpaper" -Value $wpPath -PropertyType String -Force | Out-Null
              New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "WallpaperStyle" -Value "10" -PropertyType String -Force | Out-Null
          }

          # ==========================================
          Write-Log "🌐 [PHASE 5] Configuring RDP & Services..." "Cyan"
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue

          Write-Log "🔐 [PHASE 6] Installing Tailscale..." "Cyan"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\ts.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\ts.msi" -Force

          $tsApiKey = "$env:TS_API_KEY"
          if ($tsApiKey) {
              try {
                  Write-Log "🗑️ Cleaning old devices..." "Yellow"
                  $devices = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/-/devices" -Headers @{ Authorization = "Bearer $tsApiKey" } -ErrorAction Stop
                  $old = $devices.devices | Where-Object { $_.hostname -eq "vexor-rdp" }
                  foreach ($d in $old) {
                      Invoke-RestMethod -Method DELETE -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers @{ Authorization = "Bearer $tsApiKey" } -ErrorAction SilentlyContinue
                  }
                  Write-Log "✅ Cleanup done." "Green"
              } catch {
                  Write-Log "⚠️ Cleanup failed: $($_.Exception.Message)" "Yellow"
              }
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTH_KEY --hostname=vexor-rdp --accept-routes

          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5; $r++
          }
          if (-not $tsIP) { Write-Log "❌ Network Fail: Tailscale did not get an IP." "Red"; exit 1 }

          $tsDNS = "vexor-rdp"
          try {
              $st = & "$env:ProgramFiles\Tailscale\tailscale.exe" status --json 2>$null | ConvertFrom-Json
              if ($st.Self.DNSName) { $tsDNS = $st.Self.DNSName.TrimEnd('.') }
          } catch {}

          # Print Info
          Write-Log "`n╔═══════════════════════════════════════════════════════╗" "Green"
          Write-Log "║          🚀 VEXOR RDP — SERVER READY                  ║" "Green"
          Write-Log "╠═══════════════════════════════════════════════════════╣" "Green"
          Write-Log "║  MagicDNS : $tsDNS" "Green"
          Write-Log "║  IP       : $tsIP" "Green"
          Write-Log "║  Username : $u" "Green"
          Write-Log "║  Password : $p" "Green"
          Write-Log "╚═══════════════════════════════════════════════════════╝`n" "Green"

          $loopsInfo = "${{ github.event.inputs.loops }}"
          $remainingLoops = if (-not $loopsInfo) { 32 } else { [int]$loopsInfo }

          $summaryLines = @(
              "# 🚀 VEXOR RDP — SERVER READY",
              "",
              "## 🔌 Connection Details",
              "| | |",
              "|---|---|",
              "| **MagicDNS (دايمًا)** | ``$tsDNS`` |",
              "| **Username** | ``$u`` |",
              "| **Password** | ``$p`` |",
              "| **Run #** | ${{ github.run_number }} |",
              "| **Loops Left** | $remainingLoops |"
          )
          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # ==========================================
          Write-Log "⏱️ [PHASE 7] Running Timer (4h 50m)..." "Cyan"
          $m = 290
          for ($i = 1; $i -le $m; $i++) {
              if ($i % 30 -eq 0) { Write-Log "Remaining: $($m - $i) min." } # يطبع كل 30 دقيقة عشان اللوج ميبقاش ضخم
              Start-Sleep -Seconds 60
          }

          # ==========================================
          Write-Log "💾 [PHASE 8] Starting Backup..." "Cyan"
          
          if (-not (Test-Path "repo_storage\data")) { New-Item -Path "repo_storage\data" -ItemType Directory -Force | Out-Null }
          $rcA = @($f, "repo_storage\data", "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS")
          & robocopy @rcA | Out-Null

          if (Test-Path "$profilePath\NTUSER.DAT") {
              foreach ($sub in @("Desktop","Documents","Downloads","Pictures","Videos","Music")) {
                  $src = "$profilePath\$sub"
                  if (Test-Path $src) {
                      $dst = "repo_storage\profile\$sub"
                      if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                      $rcA = @($src, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                      & robocopy @rcA | Out-Null
                  }
              }
              $adSrc = "$profilePath\AppData\Roaming"
              if (Test-Path $adSrc) {
                  $dst = "repo_storage\appdata\Roaming"
                  if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                  $rcA = @($adSrc, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                  & robocopy @rcA | Out-Null
              }
          }

          $wp = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "Wallpaper" -ErrorAction SilentlyContinue).Wallpaper
          if ($wp -and (Test-Path $wp)) {
              New-Item -Path "repo_storage\settings" -ItemType Directory -Force | Out-Null
              Copy-Item -Path $wp -Destination "repo_storage\settings\wallpaper.bmp" -Force
          }

          New-Item -Path "repo_storage\settings" -ItemType Directory -Force | Out-Null
          Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName } |
              Select-Object DisplayName, DisplayVersion, Publisher |
              Format-Table -AutoSize |
              Out-File -FilePath "repo_storage\settings\installed-programs.txt" -Encoding UTF8

          $bytes = (Get-ChildItem -Path "repo_storage" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Log "📊 Backup size: $mb MB" "Yellow"
          if ($mb -gt 800) { Write-Log "⚠️ WARNING: Backup size is very large (>800MB). Push might fail!" "Red" }

          Write-Log "🔄 Pushing backup to GitHub..." "Cyan"
          cd repo_storage
          git add -A
          git commit -m "VEXOR backup - run ${{ github.run_number }}" 2>$null
          
          # فحص حالة الملفات قبل الدفع
          $status = git status --porcelain
          if ($status) {
              git push origin storage-data 2>&1 | Out-Host
              if ($LASTEXITCODE -ne 0) {
                  Write-Log "❌ [ERROR] Git Push Failed! (Check repo size limits or token permissions)." "Red"
                  # لا نوقف السكربت هنا عشان نكمل التدوير
              } else {
                  Write-Log "✅ Backup pushed successfully." "Green"
              }
          } else {
              Write-Log "ℹ️ No changes to commit." "Yellow"
          }
          
          cd ..
          Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue

          # ==========================================
          Write-Log "🔁 [PHASE 9] Chain Rotation..." "Cyan"
          $loops = if (-not $loopsInfo) { 32 } else { [int]$loopsInfo }
          if ($loops -eq 1) { 
              Write-Log "🎯 VEXOR Chain Finished Successfully." "Green"
              exit 0 
          }

          $next = $loops - 1
          $bodyJson = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{ gh_api_token = ""; loops = "$next" }
          } | ConvertTo-Json -Depth 5

          try {
              Write-Log "📡 Calling GitHub API to trigger next run..." "Yellow"
              $response = Invoke-RestMethod -Method POST `
                -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/secure-rdp-loop.yml/dispatches" `
                -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
                -Body $bodyJson -ErrorAction Stop
              Write-Log "✅ Handoff SUCCESS → loop $next" "Green"
          } catch {
              Write-Log "❌ [FATAL] ROTATION FAILED!" "Red"
              Write-Log "Error Message: $($_.Exception.Message)" "Red"
              if ($_.ErrorDetails.Message) {
                  Write-Log "API Response: $($_.ErrorDetails.Message)" "Red"
              }
              throw "Rotation Failed. The chain is broken."
          }
