name: Secure RDP via Tailscale (Automated Loop)

on:
  workflow_dispatch:
    inputs:
      gh_api_token:
        description: "🔒 VEXOR | ENTER YOUR GITHUB PAT HERE (Starts with ghp_...)"
        required: true
        default: ""
      loops:
        description: "🔄 System Internal Counter (Leave Empty - Managed Automatically)"
        required: false
        default: "30"

concurrency:
  group: rdp-loop-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: 🔒 Executing Secured Core Engine & Restoring Data
        run: |
          $token = "${{ github.event.inputs.gh_api_token }}"
          if (-not $token -or -not ($token -match '^ghp_[a-zA-Z0-9]+$')) {
              Write-Error "❌ Invalid Token!"
              exit 1
          }

          $u_enc = "VkVYT1I="
          $p_enc = "YWRtaW5AMTIz"
          $w_enc = "aHR0cHM6Ly93d3cudG9vbGJveGxhcC5jb20="
          
          $u = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($u_enc))
          $p = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($p_enc))
          $w = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($w_enc))

          # Anti-Tamper Hard Verification
          if ($u -ne "VEXOR" -or [string]::IsNullOrWhiteSpace($w)) {
              Write-Error "🔒 Security Violation: Unauthorized modification detected!"
              exit 1
          }

          # ⚙️ Core RDP Configuration & Directory Setup
          $f = "D:\" + $u
          if (-Not (Test-Path -Path $f)) { New-Item -Path $f -ItemType Directory | Out-Null }

          # 📥 Restoring Data from Storage Branch (Git)
          Write-Host "🔄 Restoring previous files and settings..."
          git config --global user.name "RDP Storage Bot"
          git config --global user.email "bot@users.noreply.github.com"
          
          $repoUrl = "https://${{ github.actor }}:$token@github.com/${{ github.repository }}.git"
          git clone --branch storage-data --single-branch $repoUrl repo_storage 2>$null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "⚠️ Storage branch not found yet. Creating a new one..."
              git clone $repoUrl repo_storage
              cd repo_storage
              git checkout --orphan storage-data
              git rm -rf . 2>$null
              New-Item -Path "data" -ItemType Directory | Out-Null
              Set-Content -Path "data\.placeholder" -Value "RDP Storage Initialized"
              git add .
              git commit -m "Initialize storage branch"
              git push origin storage-data
              cd ..
          }

          if (Test-Path "repo_storage\data") {
              Copy-Item -Path "repo_storage\data\*" -Destination "$f\" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "✅ Files restored successfully to $f"
          }
          Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service -Name TermService -Force

          $securePass = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $u -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $u
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u

          # 🌐 Silent Tailscale Engine Setup
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\ts.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\ts.msi" -Force

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-vexor-${{ github.run_number }} --accept-routes
          
          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5; $r++
          }
          if (-not $tsIP) { Write-Error "Network Fail"; exit 1 }

          # Output connection details
          Write-Host "Address: $tsIP"
          Write-Host "Username: $u"
          Write-Host "Password: $p"
          Write-Host "-----------------------------------------------------------------"
          Write-Host "================================================================="

          # Runtime loop (5 hours 40 minutes)
          $m = 340
          for ($i = 1; $i -le $m; $i++) {
              $l = $m - $i
              Write-Host "[$(Get-Date)] Running Tracker: $l min remaining."
              Start-Sleep -Seconds 60
          }

          # 📤 Backing up files before rotation
          Write-Host "💾 Backing up current files and settings..."
          git clone --branch storage-data --single-branch $repoUrl repo_storage 2>$null
          if ($LASTEXITCODE -ne 0) {
              git clone $repoUrl repo_storage
              cd repo_storage
              git checkout -b storage-data
              cd ..
          }
          
          cd repo_storage
          if (-Not (Test-Path "data")) { New-Item -Path "data" -ItemType Directory | Out-Null }
          Copy-Item -Path "$f\*" -Destination "data\" -Recurse -Force -ErrorAction SilentlyContinue
          
          git add data/
          git commit -m "Auto-backup RDP state for run ${{ github.run_number }}" 2>$null
          git push origin storage-data 2>$null
          cd ..
          Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Backup completed successfully!"

          # Chain rotation
          $inputLoops = "${{ github.event.inputs.loops }}"
          $loops = if (-not $inputLoops) { 30 } else { [int]$inputLoops }
          if ($loops -eq 1) { Write-Host "🎯 Chain Finished Successfully."; exit 0 }
          
          $next = $loops - 1
          $body = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{ gh_api_token = "$token"; loops = "$next" }
          } | ConvertType-Json -Depth 5  # Fixed typo if any, standard ConvertTo-Json

          # Correcting conversion line:
          $bodyJson = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{ gh_api_token = "$token"; loops = "$next" }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/secure-rdp-loop.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $bodyJson
          Write-Host "✅ Secured handoff executed to loop iteration: $next"
