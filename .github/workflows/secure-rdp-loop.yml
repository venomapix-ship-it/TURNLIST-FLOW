name: Secure RDP via Tailscale (VEXOR Automated Loop)

on:
  workflow_dispatch:
    inputs:
      gh_api_token:
        description: "🔒 VEXOR | ENTER YOUR GITHUB PAT HERE (Starts with ghp_...)"
        required: true
        default: ""
      loops:
        description: "🔄 System Internal Counter (Leave Empty - Managed Automatically)"
        required: false
        default: ""

concurrency:
  group: rdp-loop-singleton
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: 🔒 VEXOR Core Engine - Restore & Setup
        run: |
          $ErrorActionPreference = "Continue"
          $token = "${{ github.event.inputs.gh_api_token }}"
          if (-not $token -or -not ($token -match '^ghp_[a-zA-Z0-9]+$')) {
              Write-Error "❌ Invalid Token!"
              exit 1
          }

          # 🔐 VEXOR Identity
          $u_enc = "VkVYT1I="
          $p_enc = "YWRtaW5AMTIz"
          $u = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($u_enc))
          $p = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($p_enc))

          if ($u -ne "VEXOR") {
              Write-Error "🔒 Security Violation!"
              exit 1
          }

          $securePass = ConvertTo-SecureString $p -AsPlainText -Force

          # 📋 Summary
          @"
          # 🚀 VEXOR RDP AUTOMATION
          ### 🔒 Secured Engine Active
          * **Provider:** VEXOR
          * **Mode:** Auto Loop + Full Migration
          ---
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $f = "D:\" + $u
          if (-Not (Test-Path -Path $f)) { New-Item -Path $f -ItemType Directory | Out-Null }

          # 📥 Clone storage-data
          Write-Host "🔄 Cloning storage branch..."
          git config --global user.name "VEXOR Storage Bot"
          git config --global user.email "bot@users.noreply.github.com"
          $repoUrl = "https://${{ github.actor }}:$token@github.com/${{ github.repository }}.git"

          git clone --branch storage-data --single-branch $repoUrl repo_storage 2>$null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "⚠️ Storage branch not found. Creating new..."
              git clone $repoUrl repo_storage
              cd repo_storage
              git checkout --orphan storage-data
              git rm -rf . 2>$null
              New-Item -Path "data" -ItemType Directory -Force | Out-Null
              Set-Content -Path "data\.placeholder" -Value "VEXOR Storage Initialized"
              @"
          *.tmp
          *.lock
          *.log
          Cache/
          GPUCache/
          Code Cache/
          Crashpad/
          "@ | Out-File -FilePath ".gitignore" -Encoding ASCII
              git add .
              git commit -m "Initialize VEXOR storage branch"
              git push origin storage-data
              cd ..
          }

          # 🔧 Robocopy exclusions
          $exclDirs = @("Cache","GPUCache","Code Cache","CacheStorage","Service Worker","CachedData","Crashpad","ShaderCache","Temp","tmp","Logs","logs","Crash Reports",".tmp","blob_storage","IndexedDB","Local Storage")
          $exclFiles = @("*.tmp","*.lock","*.log","LOCK","*.ldb","*.pid")

          # ============ 1) RESTORE D:\VEXOR FILES ============
          if (Test-Path "repo_storage\data") {
              $rcA = @("repo_storage\data", $f, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS")
              & robocopy @rcA | Out-Null
              Write-Host "✅ Data files restored to $f"
          }

          # ============ 2) CREATE USER + FORCE PROFILE (SAFE) ============
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $u -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          }
          if (-not (Get-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          }
          if (-not (Get-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          }

          $profilePath = "C:\Users\$u"
          $profileReady = Test-Path "$profilePath\NTUSER.DAT"

          if (-not $profileReady) {
              Write-Host "🔄 Creating user profile for $u via Task Scheduler..."
              $taskName = "VEXOR_ProfileInit"
              schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
              $createResult = schtasks /Create /TN $taskName /TR "cmd.exe /c exit" /SC ONCE /ST 23:59 /RU $u /RP $p /F /RL HIGHEST 2>&1
              Write-Host "   Task create exit code: $LASTEXITCODE"

              if ($LASTEXITCODE -eq 0) {
                  $null = schtasks /Run /TN $taskName 2>&1
                  $waited = 0
                  while (-not (Test-Path "$profilePath\NTUSER.DAT") -and $waited -lt 30) {
                      Start-Sleep -Seconds 2
                      $waited += 2
                  }
                  schtasks /Delete /TN $taskName /F 2>&1 | Out-Null
              }

              $profileReady = Test-Path "$profilePath\NTUSER.DAT"

              if ($profileReady) {
                  Write-Host "✅ Profile created successfully at $profilePath"
              } else {
                  Write-Host "⚠️ Profile not ready — Windows will create it on first RDP login"
                  if (Test-Path $profilePath) {
                      Remove-Item -Path $profilePath -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }
          } else {
              Write-Host "✅ Profile already exists: $profilePath"
          }

          # ============ 3) RESTORE PROFILE FOLDERS ============
          if ((Test-Path "repo_storage\profile") -and (Test-Path "$profilePath\NTUSER.DAT")) {
              foreach ($sub in @("Desktop","Documents","Downloads","Pictures","Videos","Music")) {
                  $src = "repo_storage\profile\$sub"
                  if (Test-Path $src) {
                      $dst = "$profilePath\$sub"
                      if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                      $rcA = @($src, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                      & robocopy @rcA | Out-Null
                      Write-Host "  ✅ Restored: $sub"
                  }
              }
          } else {
              Write-Host "⚠️ Skipping profile restore (no valid profile)"
          }

          # ============ 4) RESTORE APPDATA\ROAMING ============
          if ((Test-Path "repo_storage\appdata\Roaming") -and (Test-Path "$profilePath\NTUSER.DAT")) {
              $dstAD = "$profilePath\AppData\Roaming"
              if (-not (Test-Path $dstAD)) { New-Item -Path $dstAD -ItemType Directory -Force | Out-Null }
              $rcA = @("repo_storage\appdata\Roaming", $dstAD, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
              & robocopy @rcA | Out-Null
              Write-Host "  ✅ Restored: AppData\Roaming"
          } else {
              Write-Host "⚠️ Skipping AppData restore (no valid profile)"
          }

          # Fix permissions (best-effort)
          if (Test-Path "$profilePath\NTUSER.DAT") {
              icacls "$profilePath" /grant "${u}:(OI)(CI)F" /T /C /Q 2>$null | Out-Null
          }

          # ============ 5) RESTORE WALLPAPER ============
          if (Test-Path "repo_storage\settings\wallpaper.bmp") {
              $wpPath = "C:\Windows\Web\Wallpaper\VEXOR.bmp"
              Copy-Item "repo_storage\settings\wallpaper.bmp" $wpPath -Force
              New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Force | Out-Null
              New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "Wallpaper" -Value $wpPath -PropertyType String -Force | Out-Null
              New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "WallpaperStyle" -Value "10" -PropertyType String -Force | Out-Null
              Write-Host "  ✅ Restored: Wallpaper"
          }

          # ============ RDP CONFIG ============
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service -Name TermService -Force

          # ============ TAILSCALE ============
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\ts.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\ts.msi" -Force

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-vexor-${{ github.run_number }} --accept-routes

          $tsIP = $null; $r = 0
          while (-not $tsIP -and $r -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5; $r++
          }
          if (-not $tsIP) { Write-Error "Network Fail"; exit 1 }

          Write-Host "Address: $tsIP"
          Write-Host "Username: $u"
          Write-Host "Password: $p"
          Write-Host "-----------------------------------------------------------------"
          Write-Host "⚡ Powered by VEXOR"
          Write-Host "================================================================="

          # ============ RUNTIME LOOP (5h 20m) ============
          $m = 320
          for ($i = 1; $i -le $m; $i++) {
              $l = $m - $i
              Write-Host "[$(Get-Date)] Running Tracker: $l min remaining."
              Start-Sleep -Seconds 60
          }

          # ============ BACKUP SECTION ============
          Write-Host "💾 Backing up all data + settings..."

          # 1) Backup D:\VEXOR
          if (-not (Test-Path "repo_storage\data")) { New-Item -Path "repo_storage\data" -ItemType Directory -Force | Out-Null }
          $rcA = @($f, "repo_storage\data", "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS")
          & robocopy @rcA | Out-Null
          Write-Host "  ✅ Backed up: D:\VEXOR"

          # 2) Backup profile folders
          if (Test-Path "$profilePath\NTUSER.DAT") {
              foreach ($sub in @("Desktop","Documents","Downloads","Pictures","Videos","Music")) {
                  $src = "$profilePath\$sub"
                  if (Test-Path $src) {
                      $dst = "repo_storage\profile\$sub"
                      if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                      $rcA = @($src, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                      & robocopy @rcA | Out-Null
                  }
              }
              Write-Host "  ✅ Backed up: Profile folders"

              # 3) Backup AppData\Roaming
              $adSrc = "$profilePath\AppData\Roaming"
              if (Test-Path $adSrc) {
                  $dst = "repo_storage\appdata\Roaming"
                  if (-not (Test-Path $dst)) { New-Item -Path $dst -ItemType Directory -Force | Out-Null }
                  $rcA = @($adSrc, $dst, "/E", "/R:1", "/W:1", "/NFL", "/NDL", "/NJH", "/NJS", "/NC", "/NS") + @("/XD") + $exclDirs + @("/XF") + $exclFiles
                  & robocopy @rcA | Out-Null
                  Write-Host "  ✅ Backed up: AppData\Roaming"
              }
          } else {
              Write-Host "  ⚠️ Skipping profile backup (no valid profile)"
          }

          # 4) Backup wallpaper
          $wp = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "Wallpaper" -ErrorAction SilentlyContinue).Wallpaper
          if (-not $wp) { $wp = (Get-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "Wallpaper" -ErrorAction SilentlyContinue).Wallpaper }
          if ($wp -and (Test-Path $wp)) {
              New-Item -Path "repo_storage\settings" -ItemType Directory -Force | Out-Null
              Copy-Item -Path $wp -Destination "repo_storage\settings\wallpaper.bmp" -Force
              Write-Host "  ✅ Backed up: Wallpaper"
          }

          # 5) Backup installed programs list
          New-Item -Path "repo_storage\settings" -ItemType Directory -Force | Out-Null
          Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName } |
              Select-Object DisplayName, DisplayVersion, Publisher |
              Sort-Object DisplayName |
              Format-Table -AutoSize |
              Out-File -FilePath "repo_storage\settings\installed-programs.txt" -Encoding UTF8
          Write-Host "  ✅ Backed up: Installed programs list"

          # Size check
          $bytes = (Get-ChildItem -Path "repo_storage" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Host "📊 Total backup size: $mb MB"
          if ($mb -gt 800) {
              Write-Warning "⚠️ Backup size > 800MB — git push may fail. Clean up large files."
          }

          # Push
          cd repo_storage
          git add -A
          git commit -m "VEXOR full backup (data + profile + settings) - run ${{ github.run_number }}" 2>$null
          $pushResult = git push origin storage-data 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "⚠️ Push failed: $pushResult"
          } else {
              Write-Host "✅ Backup pushed successfully!"
          }
          cd ..
          Remove-Item -Path repo_storage -Recurse -Force -ErrorAction SilentlyContinue

          # ============ CHAIN ROTATION ============
          $inputLoops = "${{ github.event.inputs.loops }}"
          $loops = if (-not $inputLoops) { 32 } else { [int]$inputLoops }
          if ($loops -eq 1) { Write-Host "🎯 VEXOR Chain Finished Successfully."; exit 0 }

          $next = $loops - 1
          $bodyJson = @{
            ref    = "${{ github.ref_name }}"
            inputs = @{ gh_api_token = "$token"; loops = "$next" }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/secure-rdp-loop.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $bodyJson
          Write-Host "✅ VEXOR handoff executed to loop iteration: $next"
